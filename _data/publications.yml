- key: pacciani2026p4check
  preprint: true
  venue: "8th European P4 Workshop (EuroP4 '26), to appear"
  abstract: "Introduces P4Check, a tool that combines temporal verification with statement-level debugging for stateful P4 programs. A single definitional interpreter runs programs symbolically for verification and concretely to replay counterexamples in an interactive debugger."
  pdf: "/assets/europ4-2026-preprint.pdf"
  github: "https://github.com/TommasoPacciani/P4Check"
- key: pacciani2025p4ddg
  authors:
    - "Tommaso Pacciani"
    - "Damian Frölich"
    - "L. Thomas van Binsbergen"
    - "Chrysa Papagianni"
  abstract: "Introduces P4DDG, a compiler that generates P4 parser code from data-dependent grammars as an alternative to handwritten state machines. The approach translates grammars into parsing transducers using an extended Thompson construction, then lowers them through an intermediate representation into P4 code."
  pdf: "/assets/gpce2025.pdf"
  github: "https://github.com/tommanis1/P4DDG"
